# Disabled in this fork (00o-sh/homepage).
#
# Upstream automation that does not apply to this fork. Neutered to a
# workflow_dispatch-only no-op so it never runs on a schedule or on repo
# events. It is kept as a stub rather than deleted so the daily
# sync-upstream rebase auto-resolves it via the `forkkeep` merge driver
# (see .github/workflows/sync-upstream.yaml) instead of hitting a
# modify/delete conflict every time upstream edits the original.
name: Crowdin Action (disabled in fork)

on:
  workflow_dispatch:

jobs:
  noop:
    name: Disabled in fork
    runs-on: ubuntu-latest
    steps:
      - run: echo "This workflow is disabled in the 00o-sh/homepage fork."
