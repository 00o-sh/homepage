apiVersion: apps/v1
kind: Deployment
metadata:
  name: onepassword-connect
  namespace: default
  labels:
    app.kubernetes.io/name: onepassword-connect
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: onepassword-connect
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onepassword-connect
    spec:
      containers:
        - name: connect-api
          image: 1password/connect-api:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OP_SESSION
              valueFrom:
                secretKeyRef:
                  name: onepassword-connect
                  key: 1password-credentials.json
          volumeMounts:
            - name: shared-data
              mountPath: /home/opuser/.op/data
          readinessProbe:
            httpGet:
              path: /heartbeat
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
        - name: connect-sync
          image: 1password/connect-sync:latest
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: OP_SESSION
              valueFrom:
                secretKeyRef:
                  name: onepassword-connect
                  key: 1password-credentials.json
          volumeMounts:
            - name: shared-data
              mountPath: /home/opuser/.op/data
          readinessProbe:
            httpGet:
              path: /heartbeat
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: shared-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: onepassword-connect
  namespace: default
  labels:
    app.kubernetes.io/name: onepassword-connect
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: api
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: sync
  selector:
    app.kubernetes.io/name: onepassword-connect
---
apiVersion: v1
kind: Secret
metadata:
  name: onepassword-connect
  namespace: default
  labels:
    app.kubernetes.io/name: onepassword-connect
type: Opaque
stringData:
  1password-credentials.json: "<BASE64_ENCODED_CREDENTIALS>"
